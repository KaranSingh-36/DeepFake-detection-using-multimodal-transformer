# FusionTrace default configuration. Override any key on the command line:
#   python scripts/train.py --set train.fusion=concat --set train.epochs=5

data:
  dataset_root: null              # null -> $LAVDF_ROOT or known locations (see fusiontrace/paths.py)
  metadata_csv: metadata/lavdf_metadata.csv
  cache_dir: data/features        # per-video frozen encoder features
  visual_fps: 5                   # frames per second fed to ViT
  image_size: 224
  face_crop: true                 # Haar-cascade face crop (no-op for LAV-DF, matters for uploads)
  sample_rate: 16000
  audio_layers: [6, 12]           # Wav2Vec2 hidden states kept in the cache
  audio_pool: 2                   # 50 Hz -> 25 Hz
  audio_chunk_seconds: 4.0        # bounded audio context when encoding whole clips
  audio_hop_seconds: 3.2

encoders:
  video_model_name: google/vit-base-patch16-224
  audio_model_name: facebook/wav2vec2-base

window:
  seconds: 1.6                    # LAV-DF fake segments: mean 0.65 s, 90% under 1.0 s
  train_stride_seconds: 0.4
  eval_stride_seconds: 0.2
  min_overlap_seconds: 0.2        # positive if overlap >= min(0.2 s, 50% of the fake period)
  min_overlap_fraction: 0.5
  jitter_seconds: 0.2             # random shift of training windows

model:
  dim: 256
  heads: 4
  temporal_layers: 1
  dropout: 0.1

train:
  name: null                      # run name -> results/runs/<name>; null = auto
  source: cache                   # cache | raw (raw decodes video and can fine-tune the encoders)
  fusion: cross_attention         # cross_attention | concat | video_only | audio_only
  epochs: 8
  windows_per_epoch: 40000        # balanced samples drawn per epoch
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.01
  warmup_fraction: 0.05
  grad_clip: 1.0
  loss_weights: {video: 1.0, audio: 1.0, fused: 1.0, steps: 1.0}   # steps = per-step localisation heads
  num_workers: 4
  amp: auto                       # auto | true | false
  seed: 42
  max_train_videos: null          # subset for quick runs
  max_dev_videos: 2000            # dev videos scored each epoch
  select_by: video_auc            # checkpoint selection metric
  # raw mode only
  trainable_video_blocks: 0
  trainable_audio_blocks: 0
  gradient_checkpointing: true
  raw_batch_size: 4
  raw_lr_encoders: 0.00002

eval:
  split: test
  max_videos: null
  batch_windows: 256
  score_pooling: max              # max | top3 (mean of 3 highest windows)
  curve_resolution: 0.05
  min_segment_seconds: 0.2
  iou_thresholds: [0.5, 0.75, 0.95]

inference:
  checkpoint: results/runs/latest/best.pt
